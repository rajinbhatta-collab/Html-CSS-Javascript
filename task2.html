<!DOCTYPE html>
<html lang="en">
<head>
    <title>Three Div Boxes</title>
    <style>
        div {
            border: 2px solid rgb(236, 9, 9);
            padding: 50px;
            margin: 100px;
            width: 200px;
            height: 300px;
        }
        .box-two {
            background-color: rgb(18, 94, 93);
            color: rgb(245, 10, 226);
            font-size: 18px;
            text-align: center;
        }
        #box-three {
            background-color: rgb(91, 4, 4);
            color: rgb(244, 244, 19);
            font-family: times new roman;
            text-align: right;
        }
    </style>
</head>
<body>
    <div>First div</div>
    <div class="box-two">Second div</div>
    <div id="box-three">Third div</div>
</body>
</html>
